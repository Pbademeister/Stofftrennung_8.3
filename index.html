<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Labor – Trennverfahren</title>
<style>
:root{--blue:#1F5F8B;--blue2:#2E75B6;--bluebg:#EAF1FA;--yellow:#FFD600;--ink:#1a1a1a;--mute:#5b6572;--ok:#2e7d32;--okbg:#e8f5e9;--bad:#c62828;--badbg:#fdecea;--bg:#f4f7fb;--card:#fff;--line:#d5dde8}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;font-family:Calibri,"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.45}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:3px solid var(--yellow);display:flex;align-items:center;gap:14px;padding:8px 16px;flex-wrap:wrap}
.brand{color:var(--mute);font-size:15px}
.ttl{font-weight:700;color:var(--blue);font-size:19px;flex:1;min-width:180px}
.xp{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--mute)}
.xpbar{width:110px;height:10px;background:#e4e9f0;border-radius:6px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--yellow);width:0;transition:width .5s}
#map{display:flex;gap:6px;padding:12px 16px 4px;overflow-x:auto;max-width:980px;margin:0 auto}
.node{flex:1 0 74px;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;cursor:pointer;font:inherit;color:var(--ink);padding:2px}
.node .dot{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:#fff;border:3px solid var(--line);transition:.2s}
.node.open .dot{border-color:var(--blue2);box-shadow:0 0 0 4px #cfe1f4}
.node.done .dot{background:var(--okbg);border-color:var(--ok)}
.node.cur .dot{background:var(--bluebg)}
.node.locked{cursor:not-allowed;opacity:.5}
.node .lb{font-size:12.5px;text-align:center;line-height:1.15;color:var(--mute)}
.node .st{font-size:13px;color:#d4a400;height:14px;letter-spacing:1px}
main{max-width:980px;margin:0 auto;padding:8px 16px 60px}
.card{background:var(--card);border-radius:14px;box-shadow:0 1px 4px rgba(20,50,90,.12);padding:18px 20px;margin:14px 0}
h1{font-size:26px;color:var(--blue);margin:6px 0 2px}
h2{font-size:20px;margin:0 0 8px;color:var(--blue)}
h3{font-size:17px;margin:12px 0 4px}
.sub{color:var(--mute);margin:0 0 6px}
.badge{display:inline-block;background:var(--bluebg);color:var(--blue);border:1px solid var(--blue2);border-radius:20px;padding:2px 12px;font-size:14px;font-weight:700;margin-right:6px}
.badge.y{background:#fff8c9;border-color:#e0b800;color:#6b5500}
.info p{margin:6px 0}
.info b,.term{color:var(--blue)}
.key{border-left:5px solid var(--blue2);background:var(--bluebg);padding:8px 12px;border-radius:6px;margin:10px 0;font-weight:600}
.foto{margin:10px 0;text-align:center;display:none}
.foto img{max-width:100%;max-height:260px;border-radius:10px}
.foto small{display:block;color:var(--mute)}
canvas.sim{width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:10px;display:block;touch-action:manipulation}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
button.b{font:inherit;font-weight:700;border:0;border-radius:10px;padding:9px 16px;background:var(--blue);color:#fff;cursor:pointer;min-height:42px}
button.b.sec{background:#fff;color:var(--blue);border:2px solid var(--blue2)}
button.b.sel{background:var(--yellow);color:#222}
button.b:disabled{opacity:.45;cursor:default}
.ctrl label{font-weight:700;color:var(--mute)}
input[type=range]{width:200px;max-width:100%;height:30px}
.msg{min-height:26px;font-weight:600;color:var(--blue)}
.msg.ok{color:var(--ok)}
.task{border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0;background:#fff}
.task.ok{border-color:#9ccc9f;background:#fbfefb}
.task .q{font-weight:700;margin-bottom:8px}
.task .nr{display:inline-block;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;text-align:center;line-height:26px;font-size:14px;margin-right:8px}
.task.ok .nr{background:var(--ok)}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;padding:10px 14px;border-radius:10px;border:2px solid var(--line);background:#fff;cursor:pointer;min-height:44px}
.opt:hover:not(:disabled){border-color:var(--blue2);background:var(--bluebg)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg);text-decoration:line-through;opacity:.75}
.fb{margin-top:8px;font-size:15.5px}
.fb.ok{color:var(--ok)}
.fb.bad{color:var(--bad)}
select{font:inherit;padding:6px 8px;border-radius:8px;border:2px solid var(--line);background:#fff;max-width:100%}
select.ok{border-color:var(--ok);background:var(--okbg)}
select.bad{border-color:var(--bad);background:var(--badbg)}
.mrow{display:flex;gap:10px;align-items:center;margin:6px 0;flex-wrap:wrap}
.mrow .l{flex:1 1 220px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0;min-height:44px;padding:6px;border-radius:10px}
.chips.pool{background:#f1f4f8}
.chips.seq{background:var(--bluebg);border:2px dashed var(--blue2)}
.chip{font:inherit;padding:8px 12px;border-radius:20px;border:2px solid var(--blue2);background:#fff;cursor:pointer}
.chip.bad{border-color:var(--bad);background:var(--badbg)}
.chip.ok{border-color:var(--ok);background:var(--okbg)}
.heft{position:relative;margin:14px 0;border-radius:10px;border:2px solid var(--blue2);background:#fff;overflow:hidden}
.heft .hh{background:var(--blue);color:#fff;padding:6px 14px;font-weight:700}
.heft .hb{padding:12px 14px;background-image:repeating-linear-gradient(transparent 0 27px,#dbe6f3 27px 28px);background-color:#fffffb}
.heft.locked .hb{filter:blur(7px);user-select:none;pointer-events:none}
.heft .lockmsg{position:absolute;inset:34px 0 0 0;display:none;place-items:center;font-weight:700;color:var(--blue);text-align:center;padding:10px}
.heft.locked .lockmsg{display:grid}
table.ht{border-collapse:collapse;width:100%;background:#fffffb;font-size:16px}
table.ht th,table.ht td{border:1.5px solid #34495e;padding:6px 9px;vertical-align:top;text-align:left}
table.ht th{background:#e6eef7}
table.ht td small{color:var(--mute)}
.sketch{margin:10px 0;text-align:center}
.sketch svg{max-width:100%;height:auto;border:1px dashed #9db4cf;border-radius:8px;background:#fff}
.sketch .cap{font-size:14px;color:var(--mute)}
.done{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.banner{background:linear-gradient(90deg,#fff7bf,#fff);border:2px solid var(--yellow);border-radius:12px;padding:14px 18px;margin:14px 0;text-align:center}
.banner .big{font-size:22px;font-weight:700;color:var(--blue)}
.stars{color:#e0a800;font-size:26px;letter-spacing:3px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--mute);margin:6px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.hint{font-size:14px;color:var(--mute)}
footer{max-width:980px;margin:0 auto;padding:0 16px 30px;font-size:13px;color:var(--mute);display:flex;gap:14px;flex-wrap:wrap}
footer a{color:var(--blue2);cursor:pointer}
.steps li{margin:6px 0}
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.cards3 .c{border:2px solid var(--line);border-radius:12px;padding:10px;background:#fff}
.cards3 svg{width:100%;height:auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:600px){body{font-size:16px}.card{padding:14px}}
@media print{header,#map,footer,.noprint,.ctrl{display:none!important}body{background:#fff}.card{box-shadow:none;padding:0}}
</style>
</head>
<body>
<header>
  <div class="brand">Chemie | van Roye</div>
  <div class="ttl">Mission Labor – Stoffgemische trennen</div>
  <div class="xp"><span id="xpt">0 XP</span><div class="xpbar"><i id="xpb"></i></div></div>
</header>
<nav id="map" aria-label="Level"></nav>
<main id="view"></main>
<footer><span id="ver">Skript-App Trennverfahren · Stoffteilchenmodell · Klasse 8</span><a id="reset">Fortschritt zurücksetzen</a></footer>
<script>
"use strict";
// ================= Hilfsfunktionen & Zustand =================
const $ = (s, r = document) => r.querySelector(s);
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rnd = (a, b) => a + Math.random() * (b - a);
const KEY = 'trennapp_v1';
let S = { started: false, lv: {}, tk: {}, xp: 0 };
try { const j = localStorage.getItem(KEY); if (j) S = Object.assign(S, JSON.parse(j)); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const TEACHER = /lehrer/.test(location.search);
const XPMAX = 400;
let curLab = null;          // aktive Simulation (wird beim Levelwechsel beendet)

function updateXP() {
  $('#xpt').textContent = S.xp + ' XP';
  $('#xpb').style.width = Math.min(100, S.xp / XPMAX * 100) + '%';
}
function levelOpen(n) {
  if (TEACHER) return true;
  if (n === 1) return S.started;
  return !!(S.lv[n - 1] && S.lv[n - 1].done);
}

// ================= Karte =================
function renderMap(cur) {
  const m = $('#map'); m.innerHTML = '';
  LEVELS.forEach(L => {
    const open = levelOpen(L.id), done = S.lv[L.id] && S.lv[L.id].done;
    const b = el('button', 'node ' + (done ? 'done ' : '') + (open ? 'open ' : 'locked ') + (cur === L.id ? 'cur' : ''));
    const stars = done ? '★'.repeat(S.lv[L.id].stars) + '☆'.repeat(3 - S.lv[L.id].stars) : '';
    b.innerHTML = `<span class="dot">${open ? L.icon : '🔒'}</span><span class="st">${stars}</span><span class="lb">${L.short}</span>`;
    b.onclick = () => { if (open) show(L.id); };
    m.append(b);
  });
  const hb = el('button', 'node ' + (cur === 'heft' ? 'cur ' : '') + (S.lv[5] && S.lv[5].done || TEACHER ? 'open' : 'locked'));
  hb.innerHTML = `<span class="dot">${(S.lv[5] && S.lv[5].done) || TEACHER ? '📓' : '🔒'}</span><span class="st"></span><span class="lb">Meine Heftseite</span>`;
  hb.onclick = () => { if ((S.lv[5] && S.lv[5].done) || TEACHER) show('heft'); };
  m.append(hb);
}

// ================= Ansichten =================
function show(id) {
  if (curLab) { curLab.destroy(); curLab = null; }
  const v = $('#view'); v.innerHTML = '';
  renderMap(id);
  if (id === 'start') viewStart(v);
  else if (id === 'heft') viewHeft(v);
  else viewLevel(v, LEVELS.find(l => l.id === id));
  window.scrollTo({ top: 0 });
}

function viewStart(v) {
  const c = el('div', 'card');
  c.innerHTML = `<h1>Mission Labor</h1>
  <p class="sub">Heute erarbeitest du dir selbst, wie man <b>Stoffgemische</b> in ihre <b>Reinstoffe</b> trennt.</p>
  <p>Im Labor treffen verschiedene Proben ein – lauter Gemische. Dein Auftrag: Für jede Probe das richtige <b>Trennverfahren</b> finden.
  In jedem Level <b>entdeckst</b> du ein Verfahren im Experiment, löst <b>Aufgaben</b> und schreibst dann einen <b>sauberen Heftaufschrieb</b>. Erst dann wird das nächste Level frei.</p>
  <div class="key">Ein gutes Heft ist dein Ergebnis! Schreibe nur das ab, was im Kasten „In dein Heft“ steht – sauber, mit Lineal und mit Bleistift für Skizzen.</div>
  <h2>Heft vorbereiten</h2>
  <ol class="steps">
    <li>Schreibe das Datum <b>20.11.2026</b> und die Überschrift <b>„Trennverfahren für Stoffgemische“</b>.</li>
    <li>Schreibe den Merksatz ab (rahmen):
      <div class="key">Zum Trennen von Stoffgemischen werden die sich unterscheidenden Eigenschaften der Reinstoffe genutzt.</div></li>
    <li>Zeichne unter den Merksatz eine Tabelle mit <b>3 Spalten</b> und der Kopfzeile (Tipp: Heft quer legen, dann ist mehr Platz):
      <table class="ht"><tr><th style="width:26%">Verfahren<br><small>(genutzte Eigenschaft)</small></th><th>So funktioniert es<br><small>(auch auf Teilchenebene)</small></th><th style="width:22%">Beispiel</th></tr></table>
      Lass Platz: Du trägst nach jedem Level eine Zeile ein.</li>
  </ol>
  <label class="done"><input type="checkbox" id="ready" style="width:22px;height:22px"> <b>Mein Heft ist vorbereitet.</b></label>
  <div class="done"><button class="b" id="go" disabled>Mission starten ▶</button></div>`;
  v.append(c);
  const chk = $('#ready', c), go = $('#go', c);
  chk.onchange = () => go.disabled = !chk.checked;
  if (S.started) { chk.checked = true; go.disabled = false; go.textContent = 'Weiter zu Level 1 ▶'; }
  go.onclick = () => { S.started = true; save(); show(1); };
}

function viewLevel(v, L) {
  const st = S.lv[L.id] || (S.lv[L.id] = {});
  const head = el('div', 'card');
  head.innerHTML = `<span class="badge">Level ${L.id <= 6 ? L.id : 'Bonus'}</span>${L.prop ? `<span class="badge y">Genutzte Eigenschaft: ${L.prop}</span>` : ''}
  <h1>${L.icon} ${L.title}</h1>
  <div class="info">${L.intro}</div>`;
  if (L.foto) {
    const f = el('div', 'foto'); const im = new Image(); im.alt = L.foto.cap; im.src = L.foto.src;
    im.onload = () => f.style.display = 'block'; f.append(im, el('small', '', L.foto.cap)); head.append(f);
  }
  v.append(head);

  // Labor
  if (L.lab) {
    const lc = el('div', 'card');
    lc.innerHTML = `<h2>🔬 Entdecken</h2><p class="sub">${L.labIntro}</p>`;
    const host = el('div'); lc.append(host); v.append(lc);
    curLab = LABS[L.lab](host, {
      success() { markLab(L); }
    });
  }
  if (L.after) { const ac = el('div', 'card info'); ac.innerHTML = L.after; v.append(ac); }

  // Aufgaben
  const tc = el('div', 'card');
  tc.innerHTML = `<h2>🧩 Aufgaben</h2><p class="sub">${L.tasks.length} Aufgaben – Fehler sind erlaubt, sie kosten nur Sterne.</p>`;
  const tl = el('div'); tc.append(tl); v.append(tc);
  L.tasks.forEach((t, i) => tl.append(buildTask(L, t, i)));

  // Heft
  const hc = el('div', 'card');
  hc.innerHTML = `<h2>✏️ In dein Heft</h2>`;
  const hf = el('div', 'heft locked');
  hf.innerHTML = `<div class="hh">Heftaufschrieb – Level ${L.id <= 6 ? L.id : 'Bonus'}</div><div class="hb">${heftHTML(L)}</div>
    <div class="lockmsg">🔒 Löse zuerst alle Aufgaben – dann erscheint dein Heftaufschrieb.</div>`;
  hc.append(hf);
  const dn = el('div', 'done');
  dn.innerHTML = `<label><input type="checkbox" id="hck" style="width:22px;height:22px"> <b>Ich habe den Eintrag sauber ins Heft geschrieben${L.sketchesNote || ''}.</b></label>`;
  const nb = el('button', 'b', st.done ? 'Weiter ▶' : 'Level abschließen ✔'); nb.disabled = true; dn.append(nb);
  hc.append(dn); v.append(hc);
  const ban = el('div'); v.append(ban);
  const ck = $('#hck', dn);
  const refresh = () => {
    const ok = levelTasksDone(L);
    hf.classList.toggle('locked', !ok);
    ck.disabled = !ok; nb.disabled = !(ok && ck.checked);
  };
  ck.onchange = refresh;
  if (st.done) { ck.checked = true; }
  L._refresh = refresh; refresh();
  nb.onclick = () => finishLevel(L, ban);
  if (st.done) showBanner(L, ban, true);
}

function heftHTML(L) {
  let h = L.heft.map(r => `<table class="ht"><tr><td style="width:26%"><b>${r.v}</b><br><small>${r.e}</small></td><td>${r.p}</td><td style="width:22%">${r.b}</td></tr></table>`).join('');
  if (L.heftNote) h += `<p class="hint">${L.heftNote}</p>`;
  (L.sketches || []).forEach(s => { h += `<div class="sketch">${SKETCH[s.id]()}<div class="cap">${s.cap}</div></div>`; });
  return h;
}
function levelTasksDone(L) { return L.tasks.every((t, i) => S.tk[L.id + '.' + i] && S.tk[L.id + '.' + i].ok); }
function markLab(L) {
  const i = L.tasks.findIndex(t => t.t === 'lab');
  if (i < 0) return;
  const id = L.id + '.' + i;
  if (S.tk[id] && S.tk[id].ok) return;
  taskDone(L, i, 0, true);
}

function taskDone(L, i, mistakes, fromLab) {
  const id = L.id + '.' + i;
  S.tk[id] = { ok: true, m: mistakes };
  S.xp += mistakes ? 5 : 10; save(); updateXP();
  const box = document.querySelector(`[data-task="${id}"]`);
  if (box) { box.classList.add('ok'); const f = box.querySelector('.fb'); if (fromLab && f) { f.className = 'fb ok'; f.innerHTML = '✔ Geschafft! ' + (L.tasks[i].ex || ''); } }
  if (L._refresh) L._refresh();
}
function stars(L) {
  let m = 0; L.tasks.forEach((t, i) => { const k = S.tk[L.id + '.' + i]; if (k) m += k.m || 0; });
  return m <= 1 ? 3 : m <= 4 ? 2 : 1;
}
function finishLevel(L, ban) {
  const st = S.lv[L.id];
  if (!st.done) { st.done = true; st.stars = stars(L); S.xp += 20; save(); updateXP(); }
  renderMap(L.id); showBanner(L, ban, false);
}
function showBanner(L, ban, quiet) {
  const st = S.lv[L.id]; ban.innerHTML = '';
  const b = el('div', 'banner');
  const next = LEVELS.find(x => x.id === L.id + 1);
  const toHeft = L.id === 6 && !next;
  b.innerHTML = `<div class="big">${quiet ? 'Level geschafft' : '🎉 Level geschafft!'} – ${L.badge}</div><div class="stars">${'★'.repeat(st.stars)}${'☆'.repeat(3 - st.stars)}</div>`;
  const nb = el('button', 'b');
  if (L.id === 5) { b.append(el('p', '', 'Du kannst jetzt die <b>Mission</b> starten – und dir deine Heftseite ansehen.')); }
  if (next) { nb.textContent = `Weiter zu: ${next.title} ▶`; nb.onclick = () => show(next.id); b.append(nb); }
  ban.append(b); if (!quiet) b.scrollIntoView({ behavior: 'smooth', block: 'center' });
  if (L.id >= 6) {
    const hb = el('button', 'b sec', '📓 Meine Heftseite ansehen'); hb.style.marginLeft = '8px'; hb.onclick = () => show('heft'); b.append(hb);
  }
}

// ================= Heftseite =================
function viewHeft(v) {
  const c = el('div', 'card'); c.id = 'heftseite';
  let rows = '', sk = '';
  LEVELS.forEach(L => {
    if (!(S.lv[L.id] && S.lv[L.id].done) && !TEACHER) return;
    L.heft.forEach(r => rows += `<tr><td><b>${r.v}</b><br><small>${r.e}</small></td><td>${r.p}</td><td>${r.b}</td></tr>`);
    (L.sketches || []).forEach(s => sk += `<div class="sketch">${SKETCH[s.id]()}<div class="cap">${s.cap}</div></div>`);
  });
  c.innerHTML = `<h1>📓 Heftseite: Trennverfahren für Stoffgemische</h1>
  <p class="sub">20.11.2026 · Vergleiche mit deinem Heft. Fehlt etwas? Ergänze es jetzt.</p>
  <div class="key">Zum Trennen von Stoffgemischen werden die sich unterscheidenden Eigenschaften der Reinstoffe genutzt.</div>
  <table class="ht"><tr><th style="width:26%">Verfahren<br><small>(genutzte Eigenschaft)</small></th><th>So funktioniert es</th><th style="width:22%">Beispiel</th></tr>${rows}</table>
  ${sk}
  <div class="done noprint"><button class="b" onclick="window.print()">🖨 Drucken / Als PDF speichern</button></div>`;
  v.append(c);
}

// ================= Aufgaben =================
function buildTask(L, t, i) {
  const id = L.id + '.' + i, solved = S.tk[id] && S.tk[id].ok;
  const box = el('div', 'task' + (solved ? ' ok' : '')); box.dataset.task = id;
  const q = el('div', 'q', `<span class="nr">${i + 1}</span>${t.q}`); box.append(q);
  const fb = el('div', 'fb'); 
  const body = el('div'); box.append(body, fb);
  if (solved) { fb.className = 'fb ok'; fb.innerHTML = '✔ Gelöst. ' + (t.ex || ''); if (t.t !== 'lab') return box; }
  if (t.t === 'lab') { if (!solved) { fb.innerHTML = '<span class="hint">Löse das Experiment oben – diese Aufgabe wird dann automatisch abgehakt.</span>'; } return box; }
  let mistakes = 0, locked = false;
  const wrong = () => { mistakes++; fb.className = 'fb bad'; fb.innerHTML = '✖ Noch nicht richtig. ' + (t.hint ? '💡 ' + t.hint : 'Versuche es noch einmal.'); };
  const right = () => { locked = true; fb.className = 'fb ok'; fb.innerHTML = '✔ Richtig! ' + (t.ex || ''); taskDone(L, i, mistakes); };

  if (t.t === 'mc') {
    const list = el('div', 'opts'); body.append(list);
    shuffle(t.o.map((o, k) => ({ o, k }))).forEach(({ o, k }) => {
      const b = el('button', 'opt', o);

    // Teilchen
    const sp = 0.5 + (T - 20) / 45;
    const pEv = T < 100 ? (T > 60 ? 0.00025 * (T - 60) / 40 : 0) : 0.012;
    const wl = ps.filter(p => p.k === 'circ').length;
    for (let i = ps.length - 1; i >= 0; i--) {

    intro: `<p>Beim Eindampfen geht das Lösungsmittel verloren. Wie gewinnt man auch das <b>Lösungsmittel</b> zurück? Mit dem <b>Destillieren</b> (lat. <i>destillare</i>: herabträufeln).</p>
    <p>Das Gemisch wird erhitzt, bis die niedrigste Siedetemperatur eines Stoffes erreicht ist, z. B. die des Wassers. Das Wasser <b>verdampft</b>, die gelösten festen Stoffe bleiben zurück. Der Wasserdampf wird abgekühlt und <b>kondensiert</b>. Das entstehende Wasser heißt <b>Destillat</b> und wird in der <b>Vorlage</b> gesammelt. Wasser, das so gewonnen wurde, nennt man <b>destilliertes Wasser</b>.</p>
    <p>Bei einem Gemisch zweier Flüssigkeiten bewegen sich die Teilchen der <b>leichter flüchtigen</b> Substanz (niedrigere Siedetemperatur) schneller, überwinden die Anziehungskräfte und entweichen zuerst. Die Teilchen des Stoffes mit der höheren Siedetemperatur bleiben im Kolben. Je weiter die Siedetemperaturen auseinanderliegen, desto vollständiger gelingt die Trennung.</p>
    <p>Im Labor kühlt man mit dem <b>Liebigkühler</b>: Der heiße Dampf strömt durch das Kondensationsrohr, außen fließt kaltes Wasser in <b>entgegengesetzter Richtung</b> vorbei (<b>Gegenstromprinzip</b>). So wird der Dampf besonders gut abgekühlt.</p>`,
